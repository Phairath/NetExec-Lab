- name: Configure the vulnerable MSSQL path on DANTOOINE
  become: yes
  become_method: runas
  become_user: "{{ SQLSVCACCOUNT }}"
  vars:
    ansible_become_pass: "{{ SQLSVCPASSWORD }}"
  block:
    - name: Wait for the local SQLEXPRESS instance
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "SELECT 1;"
      register: mssql_srv02_ready
      retries: 30
      delay: 10
      until: mssql_srv02_ready.rc == 0
      changed_when: false

    - name: Enable the SA login and set its password
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "ALTER LOGIN [sa] ENABLE; ALTER LOGIN [sa] WITH PASSWORD = 'YourStrongPasswordHere!', CHECK_POLICY = OFF;"

    - name: Create linked server DANTOOINE if not exists
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.servers WHERE name = N'DANTOOINE') EXEC sp_addlinkedserver @server = N'DANTOOINE', @srvproduct = N'', @provider = N'MSOLEDBSQL', @datasrc = N'DANTOOINE\SQLEXPRESS';"

    - name: Configure linked server login for DANTOOINE
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "IF EXISTS (SELECT 1 FROM sys.linked_logins AS ll JOIN sys.servers AS s ON s.server_id = ll.server_id WHERE s.name = N'DANTOOINE' AND ll.local_principal_id = 0) EXEC sp_droplinkedsrvlogin @rmtsrvname = N'DANTOOINE', @locallogin = NULL; EXEC sp_addlinkedsrvlogin @rmtsrvname = N'DANTOOINE', @useself = N'false', @locallogin = NULL, @rmtuser = N'droideka', @rmtpassword = N'YourStrongPasswordHere!';"

    - name: Enable RPC and RPC Out on linked server DANTOOINE
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "EXEC sp_serveroption @server = N'DANTOOINE', @optname = N'rpc', @optvalue = N'true'; EXEC sp_serveroption @server = N'DANTOOINE', @optname = N'rpc out', @optvalue = N'true';"

    - name: Enable advanced options and xp_cmdshell
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "EXEC master.dbo.sp_configure 'show advanced options', 1; RECONFIGURE; EXEC master.dbo.sp_configure 'xp_cmdshell', 1; RECONFIGURE;"
