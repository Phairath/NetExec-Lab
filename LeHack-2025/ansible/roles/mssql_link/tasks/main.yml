- name: "create logins"
  include_tasks: logins.yml  
  vars:
    linked_server: "{{item.key}}"
    users_mapping: "{{item.value.users_mapping}}"
  with_dict: "{{linked_servers}}"

- name: default login impersonation
  win_shell: |
    SqlCmd {{ connection_type }} -b -Q "IF EXISTS (SELECT 1 FROM sys.linked_logins AS ll JOIN sys.servers AS s ON s.server_id = ll.server_id WHERE s.name = N'{{item.key}}' AND ll.local_principal_id = 0) EXEC master.dbo.sp_droplinkedsrvlogin @rmtsrvname = N'{{item.key}}', @locallogin = NULL; EXEC master.dbo.sp_addlinkedsrvlogin @rmtsrvname = N'{{item.key}}', @locallogin = NULL, @useself = N'True';"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{linked_servers}}"
