- name: Configure the vulnerable MSSQL path on MUSTAFAR
  become: yes
  become_method: runas
  become_user: "{{ SQLSVCACCOUNT }}"
  vars:
    ansible_become_pass: "{{ SQLSVCPASSWORD }}"
  block:
    - name: Wait for the local SQLEXPRESS instance
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "SELECT 1;"
      register: mssql_srv01_ready
      retries: 30
      delay: 10
      until: mssql_srv01_ready.rc == 0
      changed_when: false

    - name: Create or reset SQL login 'droideka'
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "IF EXISTS (SELECT 1 FROM sys.sql_logins WHERE name = N'droideka') BEGIN ALTER LOGIN [droideka] ENABLE; ALTER LOGIN [droideka] WITH PASSWORD = 'droideka', CHECK_POLICY = OFF; END ELSE BEGIN CREATE LOGIN [droideka] WITH PASSWORD = 'droideka', CHECK_POLICY = OFF; END;"

    - name: Create Windows login for EMPIRE\krennic
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'EMPIRE\krennic') CREATE LOGIN [EMPIRE\krennic] FROM WINDOWS;"

    - name: Grant VIEW ANY DEFINITION to EMPIRE\krennic
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "GRANT VIEW ANY DEFINITION TO [EMPIRE\krennic];"

    - name: Enable xp_cmdshell locally
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE;"

    - name: Recreate linked server to DANTOOINE
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "IF EXISTS (SELECT 1 FROM sys.servers WHERE name = N'DANTOOINE') EXEC sp_dropserver N'DANTOOINE', 'droplogins'; EXEC sp_addlinkedserver @server = N'DANTOOINE', @srvproduct = N'', @provider = N'SQLNCLI', @datasrc = N'DANTOOINE';"

    - name: Map droideka to remote sa
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "EXEC master.dbo.sp_addlinkedsrvlogin @rmtsrvname = N'DANTOOINE', @useself = N'false', @locallogin = N'droideka', @rmtuser = N'sa', @rmtpassword = N'YourStrongPasswordHere!';"

    - name: Enable RPC and RPC Out
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -E -b -Q "EXEC sp_serveroption @server = N'DANTOOINE', @optname = N'rpc', @optvalue = N'true'; EXEC sp_serveroption @server = N'DANTOOINE', @optname = N'rpc out', @optvalue = N'true';"

    - name: Verify local droideka SQL authentication
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -U droideka -P "droideka" -b -Q "SELECT SUSER_SNAME();"
      changed_when: false

    - name: Test linked server connection (using droideka SQL auth)
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -U droideka -P "droideka" -b -Q "EXEC sp_testlinkedserver N'DANTOOINE';"
      register: mssql_srv01_link_test
      retries: 18
      delay: 10
      until: mssql_srv01_link_test.rc == 0
      changed_when: false

    - name: Test remote query execution (using droideka SQL auth)
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -U droideka -P "droideka" -b -Q "SELECT name FROM DANTOOINE.master.sys.databases;"
      changed_when: false

    - name: Test remote xp_cmdshell (using droideka SQL auth)
      ansible.windows.win_shell: |
        SqlCmd -S ".\SQLEXPRESS" -U droideka -P "droideka" -b -Q "EXEC ('EXEC xp_cmdshell ''whoami'';') AT DANTOOINE;"
      register: mssql_srv01_remote_xp_cmdshell
      retries: 6
      delay: 5
      until: mssql_srv01_remote_xp_cmdshell.rc == 0
      changed_when: false
