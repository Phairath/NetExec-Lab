# - name: check install already done
#   win_stat:
#     path: "C:\\Program Files\\Microsoft SQL Server\\MSSQL15.{{sql_instance_name}}"
#   register: mssql_install_already_done

- name: check MSSQL service already exist (if failed service do not exist, launch install)
  win_service:
    name: '{{mssql_service_name}}'
  register: mssql_install_already_done
  failed_when: mssql_install_already_done is not defined
  ignore_errors: yes

- debug: msg="{{mssql_install_already_done}}"

- name: check whether extracted SQL Server media already exists
  ansible.windows.win_stat:
    path: C:\setup\mssql\media\setup.exe
  register: mssql_setup_executable

- name: find previously downloaded full SQL Server media
  ansible.windows.win_find:
    paths: C:\setup\mssql\download
    patterns:
      - SQLEXPR*_x64_ENU.exe
      - SQLServer*x64*ENU*.exe
    recurse: true
    file_type: file
  register: mssql_media_packages
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists

- name: stop early when an old SQL bootstrapper is still running
  ansible.windows.win_powershell:
    script: |
      $names = @(
          'sql_installer.exe',
          'SQL2019-SSEI-Expr.exe',
          'SQL2022-SSEI-Eval.exe',
          'SQLEXPRADV_x64_ENU.exe',
          'SQLEXPR_x64_ENU.exe'
      )
      $running = Get-CimInstance -ClassName Win32_Process |
          Where-Object {
              $_.Name -in $names -or
              ($_.Name -ieq 'setup.exe' -and $_.ExecutablePath -like 'C:\setup\mssql\media\*')
          } |
          Select-Object Name, ProcessId, CreationDate, ExecutablePath, CommandLine

      $Ansible.Changed = $false
      $Ansible.Result = $running
      if ($running) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'A previous SQL installer is still running. Reboot the host or stop the stale installer before retrying.'
              processes = $running
          }
      }
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: download complete SQL Server media directly from Microsoft
  ansible.windows.win_get_url:
    url: "{{ mssql_full_media_url }}"
    dest: "C:\\setup\\mssql\\download\\{{ mssql_full_media_filename }}"
    force: false
    url_timeout: "{{ mssql_media_download_timeout_seconds }}"
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists
    - mssql_media_packages.matched | default(0) == 0
    - mssql_full_media_url | length > 0

- name: download complete SQL Server media through the SSEI fallback
  ansible.windows.win_powershell:
    script: |
      $arguments = @(
          '/ACTION=Download',
          '/MEDIATYPE={{ mssql_media_type }}',
          '/MEDIAPATH=C:\setup\mssql\download',
          '/QUIET'
      )
      $process = Start-Process -FilePath 'C:\setup\mssql\sql_installer.exe' `
          -ArgumentList $arguments -PassThru
      $completed = $process.WaitForExit({{ mssql_media_download_timeout_seconds }} * 1000)

      if (-not $completed) {
          & taskkill.exe /PID $process.Id /T /F | Out-Null
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'Timed out downloading complete SQL Server media after {{ mssql_media_download_timeout_seconds }} seconds.'
          }
          return
      }

      $Ansible.Changed = $true
      $Ansible.Result = @{ exit_code = $process.ExitCode }
      if ($process.ExitCode -ne 0) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = "SQL Server media bootstrapper exited with code $($process.ExitCode)."
              exit_code = $process.ExitCode
          }
      }
  become: yes
  become_method: runas
  become_user: SYSTEM
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists
    - mssql_media_packages.matched | default(0) == 0
    - mssql_full_media_url | length == 0

- name: find downloaded full SQL Server media after download
  ansible.windows.win_find:
    paths: C:\setup\mssql\download
    patterns:
      - SQLEXPR*_x64_ENU.exe
      - SQLServer*x64*ENU*.exe
    recurse: true
    file_type: file
  register: mssql_media_packages_after_download
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists

- name: choose the complete SQL Server media package
  ansible.builtin.set_fact:
    mssql_media_package_path: >-
      {{ (mssql_media_packages_after_download.files | default(mssql_media_packages.files) | first).path }}
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists
    - (mssql_media_packages_after_download.matched | default(mssql_media_packages.matched | default(0))) > 0

- name: fail when the bootstrapper did not produce complete SQL Server media
  ansible.builtin.fail:
    msg: >-
      The SQL Server bootstrapper completed but no full media executable was
      found under C:\setup\mssql\download.
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists
    - (mssql_media_packages_after_download.matched | default(mssql_media_packages.matched | default(0))) == 0

- name: extract complete SQL Server media with a bounded timeout
  ansible.windows.win_powershell:
    script: |
      $arguments = @('/Q', '/X:C:\setup\mssql\media')
      $process = Start-Process -FilePath '{{ mssql_media_package_path }}' `
          -ArgumentList $arguments -PassThru
      $completed = $process.WaitForExit({{ mssql_media_extract_timeout_seconds }} * 1000)

      if (-not $completed) {
          & taskkill.exe /PID $process.Id /T /F | Out-Null
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'Timed out extracting SQL Server media after {{ mssql_media_extract_timeout_seconds }} seconds.'
          }
          return
      }

      $Ansible.Changed = $true
      $Ansible.Result = @{ exit_code = $process.ExitCode }
      if ($process.ExitCode -ne 0) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = "SQL Server media extraction exited with code $($process.ExitCode)."
              exit_code = $process.ExitCode
          }
      }
  become: yes
  become_method: runas
  become_user: SYSTEM
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_executable.stat.exists
    - mssql_media_package_path is defined

- name: verify extracted SQL Server setup exists
  ansible.windows.win_stat:
    path: C:\setup\mssql\media\setup.exe
  register: mssql_setup_after_extract
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

- name: fail when full SQL Server media extraction did not produce setup.exe
  ansible.builtin.fail:
    msg: Complete SQL Server media extraction did not produce C:\setup\mssql\media\setup.exe.
  when:
    - mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined
    - not mssql_setup_after_extract.stat.exists

- name: install SQL Server from full media with a bounded timeout
  ansible.windows.win_powershell:
    script: |
      $stdoutPath = 'C:\setup\mssql\setup-stdout.log'
      $stderrPath = 'C:\setup\mssql\setup-stderr.log'
      $arguments = @(
          '/ConfigurationFile=C:\setup\mssql\sql_conf.ini',
          '/Q',
          '/IACCEPTSQLSERVERLICENSETERMS',
          '/INDICATEPROGRESS'
      )
      $process = Start-Process -FilePath 'C:\setup\mssql\media\setup.exe' `
          -ArgumentList $arguments -RedirectStandardOutput $stdoutPath `
          -RedirectStandardError $stderrPath -PassThru
      $completed = $process.WaitForExit({{ mssql_install_timeout_seconds }} * 1000)

      if (-not $completed) {
          & taskkill.exe /PID $process.Id /T /F | Out-Null
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = 'SQL Server setup timed out after {{ mssql_install_timeout_seconds }} seconds.'
              stdout_log = $stdoutPath
              stderr_log = $stderrPath
          }
          return
      }

      $logVersion = '{{ "160" if sql_version == "MSSQL_2022" else "150" }}'
      $logRoot = "C:\Program Files\Microsoft SQL Server\$logVersion\Setup Bootstrap\Log"
      $summary = Get-ChildItem -LiteralPath $logRoot -Filter Summary.txt `
          -Recurse -ErrorAction SilentlyContinue |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
      $summaryText = if ($summary) { Get-Content -LiteralPath $summary.FullName -Raw } else { $null }

      $Ansible.Changed = $true
      $Ansible.Result = @{
          exit_code = $process.ExitCode
          summary_log = if ($summary) { $summary.FullName } else { $null }
          summary = $summaryText
          stdout_log = $stdoutPath
          stderr_log = $stderrPath
      }
      if ($process.ExitCode -notin @(0, 3010)) {
          $Ansible.Failed = $true
          $Ansible.Result = @{
              message = "SQL Server setup exited with code $($process.ExitCode)."
              exit_code = $process.ExitCode
              summary_log = if ($summary) { $summary.FullName } else { $null }
              summary = $summaryText
              stdout_log = $stdoutPath
              stderr_log = $stderrPath
          }
      }
  become: yes
  become_method: runas
  become_user: SYSTEM
  register: mssqlinstall
  when: mssql_install_already_done.state is not defined or mssql_install_already_done.name is not defined

# sql server 2022
- name: Add or update registry for ip port
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\MSSQL16.{{ sql_instance_name }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
    name: TcpPort
    data: 1433
  register: win_reg
  when: sql_version == "MSSQL_2022"

# sql server 2019
- name: Add or update registry for ip port
  win_regedit:
    path: 'HKLM:\Software\Microsoft\Microsoft SQL Server\MSSQL15.{{ sql_instance_name }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll'
    name: TcpPort
    data: 1433
  register: win_reg
  when: sql_version == "MSSQL_2019"

- name: Reboot
  win_reboot:
  when: >-
    win_reg.changed or
    (mssqlinstall.result is defined and
    (mssqlinstall.result.exit_code | int) == 3010)

- name: Firewall | Allow MSSQL through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (TCP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1433"
    Protocol: "TCP"
    Description: "Opens the listener port for MSSQL"

- name: Firewall | Allow MSSQL discover through Firewall
  win_dsc:
    resource_name: xFirewall
    Name: "Access for MSSQL (UDP-In)"
    Ensure: present
    Enabled: True
    Profile: "Domain"
    Direction: "Inbound"
    Localport: "1434"
    Protocol: "UDP"
    Description: "Opens the discover port for MSSQL"

- name: Be sure service is started
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: started

- name: Wait for port 1433 to become open on the host, start checking every 5 seconds
  ansible.windows.win_wait_for:
    port: 1433
    delay: 5

- name: Add MSSQL admin
  win_shell: |
    SqlCmd {{connection_type}} -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{item}}') CREATE LOGIN [{{item}}] FROM WINDOWS;"
    SqlCmd {{connection_type}} -b -Q "IF IS_SRVROLEMEMBER(N'sysadmin', N'{{item}}') <> 1 ALTER SERVER ROLE [sysadmin] ADD MEMBER [{{item}}];"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  loop: "{{sql_sysadmins}}"

- name: Add IMPERSONATE on login
  win_shell: |
    SqlCmd {{connection_type}} -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{item.key}}') CREATE LOGIN [{{item.key}}] FROM WINDOWS;"
    SqlCmd {{connection_type}} -b -Q "GRANT IMPERSONATE ON LOGIN::[{{item.value}}] TO [{{item.key}}];"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeaslogin}}"

- name: Add IMPERSONATE on user
  win_shell: |
    SqlCmd {{connection_type}} -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = N'{{item.key}}') CREATE LOGIN [{{item.key}}] FROM WINDOWS;"
    SqlCmd {{connection_type}} -b -Q "USE [{{item.value.db}}]; IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'{{item.value.user}}') CREATE USER [{{item.value.user}}] FOR LOGIN [{{item.value.user}}];"
    SqlCmd {{connection_type}} -b -Q "USE [{{item.value.db}}]; GRANT IMPERSONATE ON USER::[{{item.value.impersonate}}] TO [{{item.value.user}}];"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{executeasuser}}"

- name: Enable sa account
  win_shell: |
    SqlCmd {{connection_type}} -b -Q "ALTER LOGIN [sa] ENABLE;"
    SqlCmd {{connection_type}} -b -Q "ALTER LOGIN [sa] WITH PASSWORD = '{{sa_password}}', CHECK_POLICY = OFF;"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: enable MSSQL authentication and windows authent
  win_shell: |
    SqlCmd {{connection_type}} -b -Q "EXEC xp_instance_regwrite N'HKEY_LOCAL_MACHINE', N'Software\Microsoft\MSSQLServer\MSSQLServer', N'LoginMode', REG_DWORD, 2;"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"

- name: Restart service MSSQL
  win_service:
    name: '{{mssql_service_name}}'
    force_dependent_services: yes
    state: restarted
