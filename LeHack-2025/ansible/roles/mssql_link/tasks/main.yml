- name: Create SQL Linked server and enable RPC
  win_shell: |
    SqlCmd {{ connection_type }} -b -Q "IF NOT EXISTS (SELECT 1 FROM sys.servers WHERE name = N'{{item.key}}') EXEC master.dbo.sp_addlinkedserver @server = N'{{item.key}}', @srvproduct=N'', @provider=N'SQLOLEDB', @datasrc=N'{{item.value.data_src}}';"
    SqlCmd {{ connection_type }} -b -Q "EXEC master.dbo.sp_serveroption @server=N'{{item.key}}', @optname=N'rpc', @optvalue=N'true';"
    SqlCmd {{ connection_type }} -b -Q "EXEC master.dbo.sp_serveroption @server=N'{{item.key}}', @optname=N'rpc out', @optvalue=N'true';"
  become: yes
  become_method: runas
  become_user: "{{SQLSVCACCOUNT}}"
  vars:
    ansible_become_pass: "{{SQLSVCPASSWORD}}"
  with_dict: "{{linked_servers}}"

