# GOAD / NHA
sql_instance_name: SQLEXPRESS
sql_version: MSSQL_2019

# SCCM
#sql_instance_name: MSSQLSERVER
#sql_version: MSSQL_2022

# SQL2019-SSEI-Expr.exe
download_url_2019: https://download.microsoft.com/download/7/f/8/7f8a9c43-8c8a-4f7c-9f92-83c18d96b681/SQL2019-SSEI-Expr.exe
# SQL2022-SSEI-Eval.exe
download_url_2022: https://go.microsoft.com/fwlink/?linkid=2215202&clcid=0x409&culture=en-us&country=us

# The SSEI files above are web bootstrappers. Download the complete media first,
# then run setup.exe so that ConfigurationFile.ini is handled by SQL Setup.
mssql_media_type_2019: Advanced
mssql_media_type_2022: CAB
mssql_media_download_timeout_seconds: 1800
mssql_media_extract_timeout_seconds: 900
mssql_install_timeout_seconds: 5400

connection_type_2019: '-S ".\SQLEXPRESS" -E'
connection_type_2022: '-S "127.0.0.1,1433" -E'
