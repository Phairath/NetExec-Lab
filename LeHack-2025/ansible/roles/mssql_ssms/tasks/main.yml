- name: Ensure the SSMS setup directory exists
  ansible.windows.win_file:
    path: C:\setup\mssql
    state: directory

- name: Detect an existing supported SSMS installation
  ansible.windows.win_powershell:
    script: |
      $candidates = @(
          'C:\Program Files\Microsoft SQL Server Management Studio 22\Release\Common7\IDE\Ssms.exe',
          'C:\Program Files\Microsoft SQL Server Management Studio 21\Release\Common7\IDE\Ssms.exe',
          'C:\Program Files (x86)\Microsoft SQL Server Management Studio 20\Common7\IDE\Ssms.exe',
          'C:\Program Files (x86)\Microsoft SQL Server Management Studio 19\Common7\IDE\Ssms.exe',
          'C:\Program Files (x86)\Microsoft SQL Server Management Studio 18\Common7\IDE\Ssms.exe'
      )
      $installed = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
      $Ansible.Changed = $false
      $Ansible.Result = @{
          installed = $null -ne $installed
          path = $installed
      }
  register: ssms_detection

- name: Download the current SSMS 22 bootstrapper
  ansible.windows.win_get_url:
    url: https://aka.ms/ssms/22/release/vs_SSMS.exe
    dest: C:\setup\mssql\vs_SSMS.exe
    force: true
  when: not ssms_detection.result.installed

- name: Install SSMS 22 and wait for the real installer to finish
  ansible.windows.win_command: >-
    "C:\setup\mssql\vs_SSMS.exe"
    --installPath "C:\Program Files\Microsoft SQL Server Management Studio 22\Release"
    --quiet
    --wait
    --norestart
    --downloadThenInstall
  become: yes
  become_method: runas
  become_user: SYSTEM
  async: 5400
  poll: 15
  register: ssms_install_result
  failed_when: ssms_install_result.rc not in [0, 3010]
  when: not ssms_detection.result.installed

- name: Reboot when SSMS setup requires it
  ansible.windows.win_reboot:
    reboot_timeout: 1200
  when:
    - not ssms_detection.result.installed
    - ssms_install_result.rc | default(0) == 3010

- name: Verify the SSMS executable exists
  ansible.windows.win_stat:
    path: C:\Program Files\Microsoft SQL Server Management Studio 22\Release\Common7\IDE\Ssms.exe
  register: ssms_22_executable
  when: not ssms_detection.result.installed

- name: Fail when SSMS setup returned without installing SSMS
  ansible.builtin.fail:
    msg: >-
      SSMS setup returned but Ssms.exe was not found. Review the newest
      ssms_bootstrapper, ssms_client, and ssms_setup logs in C:\Windows\Temp.
  when:
    - not ssms_detection.result.installed
    - not ssms_22_executable.stat.exists
